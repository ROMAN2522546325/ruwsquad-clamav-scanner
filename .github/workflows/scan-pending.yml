name: RuWSquad ClamAV scan

on:
  workflow_dispatch:
  schedule:
    # Check the queue every 15 minutes. GitHub may delay scheduled runs under load.
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: ruwsquad-clamav-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout scanner
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ClamAV and update signatures
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --stdout
          clamscan --version

      - name: Install scanner dependencies
        run: npm install --no-audit --no-fund

      - name: Scan queued resources and attachments
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ruwsquad-files
          SCAN_BATCH_SIZE: '10'
          MAX_DOWNLOAD_BYTES: '52428800'
          MAX_ASSET_BYTES: '12582912'
          MAX_TOTAL_SCAN_BYTES: '83886080'
          MAX_SCAN_ATTEMPTS: '3'
        run: npm run scan
